name: Model Signing

# The release model is signed offline with the maintainer's Ed25519 key
# (scripts/sign_model.py); CI holds no secret and only verifies with the
# public key shipped in security/release_model.pub.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'model/**'
      - 'security/**'
      - 'scripts/sign_model.py'
      - 'detection/ml_engine.py'
      - '.github/workflows/model-signing.yml'

permissions:
  contents: read

jobs:
  verify-model:
    runs-on: ubuntu-latest
    env:
      MODEL_PATH: model/isolation_forest.pkl

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Verify model signature (public key only)
        run: |
          python scripts/sign_model.py "$MODEL_PATH" --verify --quiet

      - name: Verify tamper detection
        run: |
          cp "$MODEL_PATH" /tmp/isolation_forest.pkl
          cp "$MODEL_PATH.sig" /tmp/isolation_forest.pkl.sig
          printf tamper >> /tmp/isolation_forest.pkl
          if python scripts/sign_model.py /tmp/isolation_forest.pkl --verify --quiet; then
            echo "Tampered model verification unexpectedly passed" >&2
            exit 1
          fi

      - name: Upload signed model artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-isolation-forest-model
          if-no-files-found: error
          retention-days: 30
          path: |
            model/isolation_forest.pkl
            model/isolation_forest.pkl.sig
