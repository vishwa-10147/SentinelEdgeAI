name: CI

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest scapy
      - name: Run tests (unit + pcap replay)
        run: |
          PYTHONPATH=. pytest -q

  frontend_build:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build

  # Render deploy removed: this project is intended to run locally/internally.
  # If you later choose to enable remote deploys, re-add a deploy job here
  # that reads `RENDER_API_KEY` and `RENDER_SERVICE_ID` from a GitHub Environment
  # or repository secrets at runtime.
