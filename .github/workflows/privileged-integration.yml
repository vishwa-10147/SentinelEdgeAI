name: Privileged Integration (self-hosted)

# Real-kernel firewall tests: block, unblock and rollback against actual
# nftables/iptables inside a container with NET_ADMIN. Needs a self-hosted
# runner labelled `self-hosted, linux, docker` (see docs/SELF_HOSTED_RUNNER_SETUP.md).
# Pull requests run the same container test via containerized-firewall-integration.yml.
on:
  workflow_dispatch:
    inputs:
      run_rollback_validation:
        description: Also validate the firewall rollback guard
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths:
      - 'core/**'
      - 'tests/**'
      - '.github/workflows/privileged-integration.yml'

permissions:
  contents: read

jobs:
  firewall-integration:
    name: Run privileged firewall integration tests
    runs-on: [self-hosted, linux, docker]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build and run privileged firewall integration tests
        env:
          SENTINEL_RUN_FIREWALL_CONTAINER_TESTS: '1'
        run: pytest -q tests/test_firewall_container_integration.py

  rollback-guard-validation:
    name: Rollback guard validation (optional)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_rollback_validation }}
    needs: firewall-integration
    runs-on: [self-hosted, linux, docker]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate rollback guard behaviour
        env:
          VENV_PYTHON: python
        run: python scripts/validate_rollback_guard.py
