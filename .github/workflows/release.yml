name: Release

# Publish a release by pushing a version tag that matches the VERSION file:
#   git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+' ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match VERSION file
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION file ($file)" >&2
            exit 1
          fi

      - name: Changelog must have an entry for this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit tests
        run: PYTHONPATH=. pytest -q

      - name: Verify model signatures
        env:
          SENTINEL_MODEL_SIGNING_KEY: ${{ secrets.SENTINEL_MODEL_SIGNING_KEY }}
        run: python scripts/ci_check_model_signatures.py

      - name: Dependency audit (runtime)
        run: pip-audit -r requirements.txt

  build-and-publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the GitHub Release
      id-token: write        # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Build Raspberry Pi package (with offline wheelhouse)
        run: |
          python -m pip install --upgrade pip
          VERSION="${GITHUB_REF_NAME#v}" PYTHON=python bash scripts/build_pi_package.sh

      - name: Generate SBOM (CycloneDX)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --format cyclonedx-json \
            --output "dist/sentineledgeai-pi-${GITHUB_REF_NAME#v}.sbom.cdx.json" || true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [$version]" '
            index($0, head) == 1 {found=1; next}
            found && index($0, "## [") == 1 {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          cat >> release-notes.md <<'EOF'

          ---
          **Install / upgrade on a Raspberry Pi:** download the `.tar.gz` and `.sha256`, then see
          [README → Raspberry Pi installation](https://github.com/vishwa-10147/SentinelEdgeAI#raspberry-pi-installation).
          Verify provenance with `gh attestation verify <file>.tar.gz --repo vishwa-10147/SentinelEdgeAI`.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "SentinelEdgeAI $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
