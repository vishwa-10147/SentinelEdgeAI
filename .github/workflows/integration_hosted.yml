name: Integration (hosted fallback)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-hosted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run integration tests (hosted fallback)
        run: |
          echo "Running integration tests on hosted runner. These tests may be a subset that don't require privileged access."
          pytest tests/integration/ -q || true

      - name: Upload artifacts (if any)
        uses: actions/upload-artifact@v4
        with:
          name: integration-hosted-artifacts
          path: |
            tests/integration/*.log
