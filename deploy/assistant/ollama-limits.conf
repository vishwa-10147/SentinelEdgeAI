# systemd drop-in for Ollama when it serves the SentinelEdgeAI assistant on the brain.
# Install:  sudo install -D -m 0644 ollama-limits.conf /etc/systemd/system/ollama.service.d/sentinel-limits.conf
#           sudo systemctl daemon-reload && sudo systemctl restart ollama
# The model can never take the CPU, memory or GPU time detection needs: it runs at the lowest priority,
# capped, listening on loopback only.
[Service]
Environment=OLLAMA_HOST=127.0.0.1:11434
Environment=OLLAMA_NUM_PARALLEL=1
Environment=OLLAMA_MAX_LOADED_MODELS=1
Environment=OLLAMA_KEEP_ALIVE=10m
CPUQuota=200%
CPUWeight=10
MemoryHigh=3G
MemoryMax=4G
IOWeight=10
Nice=15
TasksMax=256
OOMScoreAdjust=900
