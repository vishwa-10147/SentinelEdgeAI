<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Helvetica,Arial,sans-serif" font-size="12">
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="bold">Power wiring (one 19 V input)</text>
  <rect x="20" y="140" width="120" height="60" rx="6" fill="#fff" stroke="#333"/><text x="80" y="165" text-anchor="middle">19 V 4.74 A</text><text x="80" y="181" text-anchor="middle">(90 W) adapter</text>
  <rect x="170" y="150" width="70" height="40" rx="4" fill="#eee" stroke="#333"/><text x="205" y="174" text-anchor="middle" font-size="11">DC jack</text>
  <rect x="265" y="150" width="70" height="40" rx="4" fill="#eee" stroke="#333"/><text x="300" y="168" text-anchor="middle" font-size="11">fuse 5 A</text><text x="300" y="182" text-anchor="middle" font-size="10">(blade, inline)</text>
  <rect x="360" y="150" width="70" height="40" rx="4" fill="#eee" stroke="#333"/><text x="395" y="174" text-anchor="middle" font-size="11">rocker</text>
  <circle cx="460" cy="170" r="6" fill="#c33"/><text x="460" y="200" text-anchor="middle" font-size="10">WAGO 221</text>
  <g stroke="#c33" stroke-width="3" fill="none">
    <line x1="140" y1="170" x2="170" y2="170"/><line x1="240" y1="170" x2="265" y2="170"/>
    <line x1="335" y1="170" x2="360" y2="170"/><line x1="430" y1="170" x2="454" y2="170"/>
    <polyline points="466,170 520,170 520,80 560,80"/>
    <polyline points="466,170 560,170"/>
  </g>
  <rect x="560" y="55" width="180" height="50" rx="6" fill="#76b900" fill-opacity="0.18" stroke="#4d7a00"/>
  <text x="650" y="76" text-anchor="middle">Jetson barrel 5.5 × 2.5 mm</text><text x="650" y="92" text-anchor="middle" font-size="11">19 V, up to 25 W</text>
  <rect x="560" y="145" width="180" height="50" rx="6" fill="#d67b3b" fill-opacity="0.2" stroke="#9a5525"/>
  <text x="650" y="166" text-anchor="middle">Buck 19 V → 5.1 V, 5 A</text><text x="650" y="182" text-anchor="middle" font-size="11">(≥ 25 W, USB-C output)</text>
  <g stroke="#e0a000" stroke-width="3" fill="none">
    <polyline points="650,195 650,240 600,240 600,270"/>
    <polyline points="650,240 700,240 700,270"/>
  </g>
  <rect x="530" y="270" width="140" height="44" rx="6" fill="#2e9e5b" fill-opacity="0.18" stroke="#1f6e3f"/><text x="600" y="290" text-anchor="middle">Pi 5 USB-C</text><text x="600" y="305" text-anchor="middle" font-size="10">5.1 V, ≤ 3 A typical</text>
  <rect x="680" y="270" width="70" height="44" rx="6" fill="#eee" stroke="#333"/><text x="715" y="290" text-anchor="middle" font-size="11">fan 5 V</text><text x="715" y="305" text-anchor="middle" font-size="10">+ switch</text>
  <text x="20" y="250" font-size="11" fill="#444">Budget: Jetson 25 W + Pi 5 12 W (27 W peak) + switch 3 W + fan 1 W + NICs 2 W ≈ 45 W typical, 60 W peak.</text>
  <text x="20" y="268" font-size="11" fill="#444">A 90 W adapter leaves headroom. Use 18 AWG for 19 V, 20 AWG for 5 V. Ground (−) is common.</text>
  <text x="20" y="286" font-size="11" fill="#444">The Pi does not get USB-PD from a plain buck: set usb_max_current_enable=1 in config.txt.</text>
</svg>
