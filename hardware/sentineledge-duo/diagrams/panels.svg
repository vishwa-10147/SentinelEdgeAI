<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Helvetica,Arial,sans-serif" font-size="11">
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="20" y="24" font-size="16" font-weight="bold">Panels (scale 2.8 px = 1 mm horizontally)</text>
  <text x="20" y="50" font-weight="bold">Front (240 × 73 mm)</text>
  <g transform="translate(40,60)">
    <rect width="672" height="120" rx="8" fill="#eef1f4" stroke="#333"/>
    <circle cx="112" cy="60" r="7" fill="#2e9e5b"/><text x="112" y="88" text-anchor="middle">PWR</text>
    <circle cx="146" cy="60" r="7" fill="#3b6fd6"/><text x="146" y="88" text-anchor="middle">LINK</text>
    <circle cx="179" cy="60" r="7" fill="#d33"/><text x="179" y="88" text-anchor="middle">ALERT</text>
    <circle cx="252" cy="60" r="17" fill="#aaa" stroke="#333"/><text x="252" y="98" text-anchor="middle">Pi power button</text>
    <rect x="433" y="33" width="42" height="54" fill="#444"/><text x="454" y="104" text-anchor="middle">NET IN</text>
    <rect x="500" y="33" width="42" height="54" fill="#444"/><text x="521" y="104" text-anchor="middle">NET OUT</text>
    <rect x="567" y="33" width="42" height="54" fill="#444"/><text x="588" y="104" text-anchor="middle">MGMT</text>
  </g>
  <text x="20" y="210" font-weight="bold">Rear</text>
  <g transform="translate(40,220)">
    <rect width="672" height="90" rx="8" fill="#eef1f4" stroke="#333"/>
    <rect x="42" y="25" width="230" height="40" fill="#444"/><text x="157" y="82" text-anchor="middle">Jetson service window (USB, DisplayPort)</text>
    <rect x="440" y="45" width="112" height="25" fill="#444"/><text x="496" y="40" text-anchor="middle">Pi service window</text>
  </g>
</svg>
