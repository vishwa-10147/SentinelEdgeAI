# Enterprise segment: faster escalation, supervised for 14 days, longer containment.
version: 1
response_mode: auto_block
default_ttl: 3600
max_ttl: 86400
playbook:
  steps:
    - {action: alert, min_risk: 45}
    - {action: rate_limit, min_risk: 60, ttl: 1800}
    - {action: block, min_risk: 75, ttl: 14400}
    - {action: quarantine, min_risk: 88, ttl: 86400}
  escalate_after: 2
  window_seconds: 900
  approval: {required_from_risk: 75, days: 14}
